name: Kulturkalender

on:
  schedule:
    - cron: '0 9 * * 6'
  workflow_dispatch:

jobs:
  send-kulturkalender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installer pakker
        run: pip install requests beautifulsoup4 lxml playwright && playwright install chromium

      - name: Opret config.py
        run: |
          echo "GMAIL_USER = '${{ secrets.GMAIL_USER }}'" > config.py
          echo "GMAIL_PASSWORD = '${{ secrets.GMAIL_PASSWORD }}'" >> config.py
          echo "RECIPIENT = '${{ secrets.GMAIL_USER }}'" >> config.py

      - name: Kør kulturkalender
        run: python3 main.py
